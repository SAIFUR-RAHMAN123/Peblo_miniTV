services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peblo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peblo}
      POSTGRES_DB: ${POSTGRES_DB:-peblo_tv}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-peblo} -d ${POSTGRES_DB:-peblo_tv}",
        ]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-peblo}:${POSTGRES_PASSWORD:-peblo}@db:5432/${POSTGRES_DB:-peblo_tv}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /app/storage_data
      STORAGE_PUBLIC_BASE_URL: http://localhost:8000/media
      EDITOR_API_KEY: ${EDITOR_API_KEY:-editor-dev-key}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-admin-dev-key}
    volumes:
      - backend_storage:/app/storage_data
    ports:
      - "8000:8000"

  cms:
    build:
      context: ./cms
      args:
        VITE_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  viewer:
    build:
      context: ./viewer
      args:
        VITE_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  pg_data:
  backend_storage:
